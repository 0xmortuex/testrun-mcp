[project]
name = "testrun-mcp"
version = "0.1.0"
description = "MCP server that runs a project's tests (pytest, unittest, jest, vitest) and returns small structured results: counts, failures with trimmed tracebacks, flaky detection, coverage."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]
keywords = ["mcp", "pytest", "unittest", "jest", "vitest", "testing", "flaky", "coverage", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio", "coverage>=7"]

[project.urls]
Homepage = "https://github.com/0xmortuex/testrun-mcp"

[project.scripts]
testrun-mcp = "testrun_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testrun_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# The unittest helper is a standalone stdlib-only script run inside the *target*
# project's interpreter (any Python 3.8+), not part of the typed package.
exclude = ["src/testrun_mcp/_helper/"]
